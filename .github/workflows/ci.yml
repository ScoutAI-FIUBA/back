name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/scoutai
      AUTH_JWT_SECRET: test-only-jwt-secret
      AUTH_REFRESH_SECRET: test-only-refresh-secret
      AUTH_JWT_ISSUER: scoutai-ci
      AUTH_JWT_AUDIENCE: scoutai-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -m "not integration" tests

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: scoutai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d scoutai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/scoutai
      AUTH_JWT_SECRET: test-only-jwt-secret
      AUTH_REFRESH_SECRET: test-only-refresh-secret
      AUTH_JWT_ISSUER: scoutai-ci
      AUTH_JWT_AUDIENCE: scoutai-client
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: python scripts/apply_migrations.py

      - name: Run integration tests
        run: pytest -m integration tests/integration
