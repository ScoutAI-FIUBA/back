name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoutai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d scoutai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scoutai
      AUTH_JWT_SECRET: ci-jwt-secret
      AUTH_REFRESH_SECRET: ci-refresh-secret
      AUTH_JWT_ISSUER: scoutai-ci
      AUTH_JWT_AUDIENCE: scoutai-client
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run pytest suite
        run: pytest -q tests
