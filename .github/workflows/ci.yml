name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/scoutai
      AUTH_JWT_SECRET: test-only-jwt-secret
      AUTH_REFRESH_SECRET: test-only-refresh-secret
      AUTH_JWT_ISSUER: scoutai-ci
      AUTH_JWT_AUDIENCE: scoutai-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -m "not integration" tests
