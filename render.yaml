services:
  - type: web
    name: scoutai-back
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_REFRESH_SECRET
        generateValue: true
      - key: AUTH_JWT_ISSUER
        value: scoutai-prod
      - key: AUTH_JWT_AUDIENCE
        value: scoutai-prod-client
      - key: DB_WAIT_TIMEOUT_SECONDS
        value: "60"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      # --- Video processing service -------------------------------------
      # All optional: with these unset the app boots normally and every other
      # endpoint works; only job submission returns a 502 explaining why.

      # The processing service's endpoint, printed by `modal deploy`.
      - key: PROCESSING_SERVICE_URL
        sync: false
      # Sent to the processing service. Must equal the token that service
      # expects, so it is copied rather than generated.
      - key: PROCESSING_SERVICE_TOKEN
        sync: false
      # Guards POST /internal/jobs/status, the callback the processing service
      # uses to report progress. Must be the SAME string configured on the
      # processing service, so it is pasted rather than generated — a generated
      # value would never match and every callback would be rejected.
      - key: PROCESSING_CALLBACK_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
